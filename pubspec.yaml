name: bookie_buddy_shared
description: >
  Shared domain + visual layer for Bookie Buddy's mobile and web apps:
  entities, usecases, repository interfaces, domain enums (lib/core/ — pure
  Dart by convention, see scripts/check_core_purity.dart), plus design tokens,
  enum→color/icon mappings, and deterministic data→bitmap rendering
  pipelines (lib/ui/ — Flutter-typed, depends on lib/core/). Formerly two
  packages (bookie_buddy_core, bookie_buddy_ui), merged — see CHANGELOG.md.
  See docs/shared-packages-plan.md in the mobile repo for the full
  rationale, and docs/PENDING.md in this repo for what's copied here but
  not yet wired up.

version: 1.1.0

publish_to: "none"

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # JSON-shaped types (e.g. CancelToken) show up in a couple of usecase
  # signatures (file download progress/cancellation) — dio itself has no
  # Flutter dependency, so it doesn't compromise lib/core/'s pure-Dart
  # convention.
  dio: ^5.8.0+1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  collection: ^1.19.1
  clock: ^1.1.2
  cached_network_image: ^3.4.1
  image: ^4.3.0
  intl: ^0.20.2

dev_dependencies:
  build_runner: ^2.11.0
  fake_async: ^1.3.3
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_lints: ^5.0.0
  test: ^1.25.0
