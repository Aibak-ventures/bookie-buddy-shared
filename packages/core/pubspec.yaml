name: bookie_buddy_core
description: >
  Shared domain layer (entities, usecases, repository interfaces, and
  domain-referenced enums) for Bookie Buddy's mobile and web apps.
  Pure Dart — no Flutter dependency. See docs/shared-packages-plan.md in the
  mobile repo for the full rationale.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  # JSON-shaped types (e.g. CancelToken) show up in a couple of usecase
  # signatures (file download progress/cancellation) — dio itself has no
  # Flutter dependency, so it doesn't compromise the pure-Dart guarantee.
  dio: ^5.8.0+1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  collection: ^1.19.1

dev_dependencies:
  build_runner: ^2.11.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  lints: ^5.0.0
  test: ^1.25.0
