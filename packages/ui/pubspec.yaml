name: bookie_buddy_ui
description: >
  Shared, purely-visual layer for Bookie Buddy's mobile and web apps:
  design tokens, enum→color/icon mappings, and deterministic data→bitmap
  rendering pipelines (currently: the thermal-receipt canvas renderer).
  Depends on bookie_buddy_core. See docs/shared-packages-plan.md in the
  mobile repo for the full rationale, and docs/PENDING.md in this repo for
  what's copied here but not yet wired up.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bookie_buddy_core:
    path: ../core
  cached_network_image: ^3.4.1
  image: ^4.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^5.0.0
